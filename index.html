<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Круговая гонка</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #fff;
    }
    h1 { margin-bottom: 20px; font-size: 26px; text-shadow: 0 2px 6px rgba(0,0,0,0.5); }

    .game-layout {
      display: flex;
      gap: 30px;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
    }

    .board-wrap {
      position: relative;
      width: 560px;
      height: 560px;
      border-radius: 50%;
      background: radial-gradient(circle, #2c3e50 0%, #1a252f 100%);
      box-shadow: 0 0 40px rgba(0,0,0,0.6), inset 0 0 60px rgba(0,0,0,0.5);
    }

    .cell {
      position: absolute;
      width: 52px;
      height: 52px;
      background: #ecf0f1;
      border: 2px solid #34495e;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      color: #2c3e50;
      transition: background 0.2s, transform 0.15s;
      cursor: default;
      z-index: 2;
    }
    .cell.bonus { background: #2ecc71; color: #fff; }
    .cell.trap { background: #e74c3c; color: #fff; }
    .cell.start { background: #f39c12; color: #fff; }
    .cell.drag-over { transform: scale(1.15); box-shadow: 0 0 15px #fff; }
    .cell .piece-mini {
      width: 40px;
      height: 40px;
      object-fit: contain;
      pointer-events: none;
    }

    .center-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 140px;
      height: 140px;
      transform: translate(-50%, -50%);
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      text-align: center;
      padding: 10px;
      border: 2px dashed rgba(255,255,255,0.3);
      z-index: 1;
    }

    .side-panel {
      width: 300px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .pieces-area {
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 15px;
      border: 2px dashed rgba(255,255,255,0.3);
    }
    .pieces-area h3 { font-size: 15px; margin-bottom: 10px; }
    .pieces-list { display: flex; gap: 10px; justify-content: center; }
    .piece {
      width: 60px;
      height: 60px;
      object-fit: contain;
      cursor: grab;
      border-radius: 8px;
      background: #fff;
      padding: 5px;
      transition: transform 0.2s;
    }
    .piece:hover { transform: scale(1.1); }
    .piece:active { cursor: grabbing; }
    .piece.active-piece { outline: 3px solid #f39c12; transform: scale(1.1); }

    .dice-area {
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
    }
    .dice {
      width: 70px;
      height: 70px;
      background: #fff;
      color: #2c3e50;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      margin: 0 auto 10px;
      transition: transform 0.2s;
    }
    .dice.rolling { animation: rollAnim 0.4s infinite; }
    @keyframes rollAnim {
      0%,100% { transform: rotate(0deg); }
      25% { transform: rotate(90deg) scale(1.1); }
      50% { transform: rotate(180deg); }
      75% { transform: rotate(270deg) scale(1.1); }
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #f39c12;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      width: 100%;
    }
    button:hover:not(:disabled) { background: #e67e22; transform: translateY(-2px); }
    button:disabled { background: #7f8c8d; cursor: not-allowed; }

    .leaderboard {
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 15px;
      max-height: 250px;
      overflow-y: auto;
    }
    .leaderboard h3 { font-size: 15px; margin-bottom: 10px; }
    .lb-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 8px;
      border-radius: 6px;
      margin-bottom: 5px;
      background: rgba(255,255,255,0.08);
      font-size: 14px;
    }
    .lb-item.active { background: rgba(243,156,18,0.4); font-weight: bold; }

    .log {
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      padding: 15px;
      max-height: 160px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.5;
      width: 100%;
      max-width: 900px;
      margin-top: 20px;
    }
    .log p { margin-bottom: 4px; }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: linear-gradient(135deg, #f39c12, #e74c3c);
      padding: 40px 60px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 0 50px rgba(243,156,18,0.7);
      animation: popIn 0.5s ease;
    }
    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-content h2 { font-size: 40px; margin-bottom: 15px; }
    .modal-content p { font-size: 20px; margin-bottom: 25px; }
    .modal-content button { width: auto; padding: 12px 40px; }

    @media (max-width: 900px) {
      .board-wrap { width: 360px; height: 360px; }
      .cell { width: 34px; height: 34px; font-size: 9px; }
      .cell .piece-mini { width: 26px; height: 26px; }
      .center-circle { width: 90px; height: 90px; font-size: 11px; }
      .side-panel { width: 100%; max-width: 400px; }
    }
  </style>
</head>
<body>

<h1>🎲 Круговая гонка</h1>

<div class="game-layout">
  <div class="board-wrap" id="board"></div>

  <div class="side-panel">
    <div class="pieces-area">
      <h3>Фишки (перетащите на старт)</h3>
      <div class="pieces-list" id="piecesArea">
        <img class="piece" src="https://cdn-icons-png.flaticon.com/512/616/616494.png" alt="1" draggable="true" data-id="1">
        <img class="piece" src="https://cdn-icons-png.flaticon.com/512/616/616554.png" alt="2" draggable="true" data-id="2">
        <img class="piece" src="https://cdn-icons-png.flaticon.com/512/616/616408.png" alt="3" draggable="true" data-id="3">
      </div>
    </div>

    <div class="dice-area">
      <div class="dice" id="dice">?</div>
      <button id="rollBtn" disabled>Бросить кубик</button>
    </div>

    <div class="leaderboard">
      <h3>🏆 Лидерборд</h3>
      <div id="leaderboardList"></div>
    </div>
  </div>
</div>

<div class="log" id="log"></div>

<div class="modal" id="winModal">
  <div class="modal-content">
    <h2>🏆 Победитель!</h2>
    <p id="winnerText"></p>
    <button onclick="location.reload()">Играть снова</button>
  </div>
</div>

<script>
  const TOTAL_CELLS = 16;
  const START_CELLS = [0, 1, 2];
  const BONUS_CELLS = { 4: 2, 9: 3, 13: 2 };
  const TRAP_CELLS = { 6: -2, 11: -3, 15: -2 };

  const boardEl = document.getElementById('board');
  const logEl = document.getElementById('log');
  const diceEl = document.getElementById('dice');
  const rollBtn = document.getElementById('rollBtn');
  const piecesArea = document.getElementById('piecesArea');
  const leaderboardList = document.getElementById('leaderboardList');
  const winModal = document.getElementById('winModal');
  const winnerText = document.getElementById('winnerText');

  let activePiece = null;
  let gameStarted = false;
  let gameOver = false;
  const piecePositions = {};
  const pieceNames = { '1': 'Фишка 1', '2': 'Фишка 2', '3': 'Фишка 3' };

  const boardRadius = 230;
  const centerX = 280;
  const centerY = 280;

  function createBoard() {
    for (let i = 0; i < TOTAL_CELLS; i++) {
      const cell = document.createElement('div');
      cell.classList.add('cell');
      cell.dataset.pos = i;
      cell.dataset.index = i;

      const angle = (i / TOTAL_CELLS) * 2 * Math.PI - Math.PI / 2;
      const x = centerX + boardRadius * Math.cos(angle) - 26;
      const y = centerY + boardRadius * Math.sin(angle) - 26;
      cell.style.left = x + 'px';
      cell.style.top = y + 'px';

      if (START_CELLS.includes(i)) {
        cell.classList.add('start');
        cell.textContent = 'S' + (i + 1);
      } else if (BONUS_CELLS[i]) {
        cell.classList.add('bonus');
        cell.textContent = '+' + BONUS_CELLS[i];
      } else if (TRAP_CELLS[i]) {
        cell.classList.add('trap');
        cell.textContent = TRAP_CELLS[i];
      } else {
        cell.textContent = i + 1;
      }

      boardEl.appendChild(cell);
    }

    const center = document.createElement('div');
    center.className = 'center-circle';
    center.textContent = 'Круг = победа';
    boardEl.appendChild(center);
  }

  function makeResponsive() {
    const isMobile = window.innerWidth <= 900;
    const cells = document.querySelectorAll('.cell');
    const radius = isMobile ? 145 : 230;
    const cx = isMobile ? 180 : 280;
    const cy = isMobile ? 180 : 280;
    const size = isMobile ? 34 : 52;

    cells.forEach(cell => {
      const i = parseInt(cell.dataset.pos);
      const angle = (i / TOTAL_CELLS) * 2 * Math.PI - Math.PI / 2;
      const x = cx + radius * Math.cos(angle) - size / 2;
      const y = cy + radius * Math.sin(angle) - size / 2;
      cell.style.left = x + 'px';
      cell.style.top = y + 'px';
    });
  }

  createBoard();
  makeResponsive();
  window.addEventListener('resize', makeResponsive);

  let draggedPiece = null;
  let draggedFromCell = null;

  function bindPieceEvents() {
    document.querySelectorAll('.piece').forEach(piece => {
      piece.addEventListener('dragstart', e => {
        if (gameOver) { e.preventDefault(); return; }
        draggedPiece = piece;
        e.dataTransfer.setData('text/plain', piece.dataset.id);
        e.dataTransfer.effectAllowed = 'move';
        draggedFromCell = piece.closest('.cell');
      });
      piece.addEventListener('dragend', () => {
        draggedPiece = null;
        draggedFromCell = null;
      });
      piece.addEventListener('click', () => selectPiece(piece));
    });
  }

  function selectPiece(piece) {
    if (gameOver) return;
    document.querySelectorAll('.piece').forEach(p => p.classList.remove('active-piece'));
    piece.classList.add('active-piece');
    activePiece = piece;
    logMessage(`👉 Выбрана ${pieceNames[piece.dataset.id]}.`);
    updateLeaderboard();
  }

  document.querySelectorAll('.cell').forEach(cell => {
    cell.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      cell.classList.add('drag-over');
    });
    cell.addEventListener('dragleave', () => cell.classList.remove('drag-over'));
    cell.addEventListener('drop', e => {
      e.preventDefault();
      cell.classList.remove('drag-over');
      if (!draggedPiece || gameOver) return;

      const pos = parseInt(cell.dataset.pos);

      if (!draggedFromCell && !START_CELLS.includes(pos)) {
        logMessage('❌ На старт можно ставить только на первые 3 клетки.');
        return;
      }

      if (cell.querySelector('.piece')) {
        logMessage('❌ Клетка занята.');
        return;
      }

      if (draggedFromCell) {
        const old = draggedFromCell.querySelector('.piece');
        if (old) old.remove();
        delete piecePositions[draggedPiece.dataset.id];
      }

      cell.appendChild(draggedPiece);
      draggedPiece.style.width = '40px';
      draggedPiece.style.height = '40px';
      draggedPiece.classList.add('piece-mini');

      piecePositions[draggedPiece.dataset.id] = pos;
      logMessage(`✅ ${pieceNames[draggedPiece.dataset.id]} на клетке ${pos + 1}.`);

      if (!activePiece) selectPiece(draggedPiece);
      checkGameStart();
      updateLeaderboard();
    });
  });

  piecesArea.addEventListener('dragover', e => e.preventDefault());
  piecesArea.addEventListener('drop', e => {
    e.preventDefault();
    if (!draggedPiece || !draggedFromCell || gameOver) return;
    draggedFromCell.querySelector('.piece')?.remove();
    draggedPiece.style.width = '';
    draggedPiece.style.height = '';
    draggedPiece.classList.remove('piece-mini');
    piecesArea.appendChild(draggedPiece);
    delete piecePositions[draggedPiece.dataset.id];
    if (activePiece === draggedPiece) activePiece = null;
    checkGameStart();
    updateLeaderboard();
  });

  function checkGameStart() {
    const onBoard = document.querySelectorAll('.cell .piece').length;
    if (onBoard === 3 && !gameStarted) {
      gameStarted = true;
      rollBtn.disabled = false;
      logMessage('🎲 Все фишки на старте! Бросайте кубик.');
      if (!activePiece) {
        const first = document.querySelector('.cell .piece');
        if (first) selectPiece(first);
      }
    } else if (onBoard < 3 && gameStarted) {
      gameStarted = false;
      rollBtn.disabled = true;
    }
  }

  rollBtn.addEventListener('click', () => {
    if (!gameStarted || gameOver || !activePiece) return;
    rollBtn.disabled = true;
    diceEl.classList.add('rolling');

    let count = 0;
    const interval = setInterval(() => {
      diceEl.textContent = Math.floor(Math.random() * 6) + 1;
      count++;
      if (count > 10) {
        clearInterval(interval);
        diceEl.classList.remove('rolling');
        finishRoll();
      }
    }, 80);
  });

  function finishRoll() {
    const result = Math.floor(Math.random() * 6) + 1;
    diceEl.textContent = result;

    const id = activePiece.dataset.id;
    const currentPos = piecePositions[id];
    const currentCell = document.querySelector(`.cell[data-pos="${currentPos}"]`);

    let newPos = (currentPos + result) % TOTAL_CELLS;
    const passedCircle = currentPos + result >= TOTAL_CELLS;

    let extraMsg = '';

    if (BONUS_CELLS[newPos]) {
      extraMsg = ` 🚀 Буст +${BONUS_CELLS[newPos]}!`;
      newPos = (newPos + BONUS_CELLS[newPos]) % TOTAL_CELLS;
    } else if (TRAP_CELLS[newPos]) {
      extraMsg = ` 💥 Откат ${TRAP_CELLS[newPos]}!`;
      newPos = (newPos + TRAP_CELLS[newPos] + TOTAL_CELLS) % TOTAL_CELLS;
    }

    const targetCell = document.querySelector(`.cell[data-pos="${newPos}"]`);
    const occupant = targetCell.querySelector('.piece');

    if (occupant && occupant !== activePiece) {
      logMessage(`🎲 Выпало ${result}. ${pieceNames[id]} сталкивается с ${pieceNames[occupant.dataset.id]} и остаётся на месте.${extraMsg}`);
      rollBtn.disabled = false;
      return;
    }

    currentCell.querySelector('.piece')?.remove();
    targetCell.appendChild(activePiece);
    piecePositions[id] = newPos;

    logMessage(`🎲 Выпало ${result}. ${pieceNames[id]} → клетка ${newPos + 1}.${extraMsg}`);
    updateLeaderboard();

    if (passedCircle || newPos === 0) {
      endGame(id);
      return;
    }

    const pieces = document.querySelectorAll('.cell .piece');
    const currentIndex = Array.from(pieces).indexOf(activePiece);
    const nextPiece = pieces[(currentIndex + 1) % pieces.length];
    if (nextPiece) selectPiece(nextPiece);

    rollBtn.disabled = false;
  }

  function updateLeaderboard() {
    const entries = [];
    document.querySelectorAll('.cell .piece').forEach(piece => {
      const id = piece.dataset.id;
      const pos = piecePositions[id];
      const cell = document.querySelector(`.cell[data-pos="${pos}"]`);
      const offset = Array.from(cell.querySelectorAll('.piece')).indexOf(piece);
      entries.push({ id, pos, offset });
    });

    entries.sort((a, b) => {
      if (b.pos !== a.pos) return b.pos - a.pos;
      return a.offset - b.offset;
    });

    leaderboardList.innerHTML = '';
    entries.forEach((e, idx) => {
      const div = document.createElement('div');
      div.className = 'lb-item';
      if (activePiece && activePiece.dataset.id === e.id) div.classList.add('active');
      div.innerHTML = `<span>${idx + 1}. ${pieceNames[e.id]}</span><span>Клетка ${e.pos + 1}</span>`;
      leaderboardList.appendChild(div);
    });
  }

  function endGame(winnerId) {
    gameOver = true;
    rollBtn.disabled = true;
    winnerText.textContent = `Победитель: ${pieceNames[winnerId]}! 🎉`;
    winModal.classList.add('show');
    logMessage(`🏆 ${pieceNames[winnerId]} завершает круг и побеждает!`);
  }

  function logMessage(msg) {
    const p = document.createElement('p');
    p.textContent = msg;
    logEl.prepend(p);
  }

  bindPieceEvents();
  logMessage('Перетащите три фишки на стартовые клетки (S1, S2, S3).');
  updateLeaderboard();
</script>

</body>
</html>
